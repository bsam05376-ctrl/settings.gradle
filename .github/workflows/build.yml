name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup all Android files cleanly
        run: |
          mkdir -p /tmp/fix_src
          find . -maxdepth 15 -type f -name "index.html" -exec cp {} /tmp/fix_src/index.html \;
          if [ ! -f /tmp/fix_src/index.html ]; then echo "ERROR: index.html not found"; exit 1; fi
          rm -rf app/src/main
          mkdir -p app/src/main/java/com/debtsapp/ledger app/src/main/assets app/src/main/res/xml
          cp /tmp/fix_src/index.html app/src/main/assets/index.html

          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="receipts" path="." />
          </paths>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <queries>
                  <package android:name="com.whatsapp" />
                  <package android:name="com.whatsapp.w4b" />
                  <intent>
                      <action android:name="android.intent.action.PICK" />
                      <data android:mimeType="vnd.android.cursor.dir/phone_v2" />
                  </intent>
              </queries>
              <application
                  android:allowBackup="true"
                  android:label="دفتر الديون"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/debtsapp/ledger/MainActivity.java
          package com.debtsapp.ledger;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.ContactsContract;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.core.content.FileProvider;
          import org.json.JSONObject;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {

              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int REQ_FILE_CHOOSER = 1001;
              private static final int REQ_CONTACT_PICK = 1002;
              private static final int REQ_SAVE_FILE = 1003;
              private byte[] pendingSaveBytes;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      getWindow().setStatusBarColor(0xFF0D6A57);
                      webView = new WebView(this);
                      WebSettings settings = webView.getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setDatabaseEnabled(true);
                      settings.setAllowFileAccess(true);
                      settings.setAllowContentAccess(true);

                      webView.setWebViewClient(new WebViewClient());
                      webView.setWebChromeClient(new WebChromeClient() {
                          @Override
                          public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                              if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                              filePathCallback = callback;
                              try {
                                  startActivityForResult(params.createIntent(), REQ_FILE_CHOOSER);
                                  return true;
                              } catch (Exception e) {
                                  filePathCallback = null;
                                  return false;
                              }
                          }
                      });

                      webView.addJavascriptInterface(new AndroidBridge(), "AndroidBridge");
                      setContentView(webView);
                      webView.loadUrl("file:///android_asset/index.html");
                  } catch (Throwable t) {
                      TextView tv = new TextView(this);
                      tv.setPadding(40, 80, 40, 40);
                      tv.setText("Error: " + t.toString());
                      setContentView(tv);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null) {
                      webView.evaluateJavascript("window.handleAndroidBack ? window.handleAndroidBack() : false", val -> {
                          if (!"true".equals(val)) finish();
                      });
                  } else {
                      finish();
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_FILE_CHOOSER) {
                      if (filePathCallback != null) {
                          filePathCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                          filePathCallback = null;
                      }
                  } else if (requestCode == REQ_CONTACT_PICK && resultCode == RESULT_OK && data != null && data.getData() != null) {
                      Uri uri = data.getData();
                      String name = "";
                      String phone = "";
                      try (Cursor cursor = getContentResolver().query(
                              uri,
                              new String[]{ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER},
                              null, null, null)) {
                          if (cursor != null && cursor.moveToFirst()) {
                              name = cursor.getString(0);
                              phone = cursor.getString(1);
                          }
                      } catch (Exception e) {
                          Toast.makeText(this, "تعذر قراءة جهة الاتصال", Toast.LENGTH_SHORT).show();
                      }
                      String js = "if(window.onNativeContactPicked){window.onNativeContactPicked("
                              + JSONObject.quote(name != null ? name : "") + ","
                              + JSONObject.quote(phone != null ? phone : "") + ");}";
                      webView.evaluateJavascript(js, null);
                  } else if (requestCode == REQ_SAVE_FILE && resultCode == RESULT_OK && data != null && data.getData() != null && pendingSaveBytes != null) {
                      try (OutputStream os = getContentResolver().openOutputStream(data.getData())) {
                          if (os != null) {
                              os.write(pendingSaveBytes);
                              Toast.makeText(this, "تم حفظ الملف بنجاح", Toast.LENGTH_SHORT).show();
                          }
                      } catch (Exception e) {
                          Toast.makeText(this, "خطأ في الحفظ: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                      }
                      pendingSaveBytes = null;
                  }
              }

              private boolean isPackageInstalled(String pkg) {
                  try {
                      getPackageManager().getPackageInfo(pkg, 0);
                      return true;
                  } catch (PackageManager.NameNotFoundException e) {
                      return false;
                  }
              }

              public class AndroidBridge {
                  @JavascriptInterface
                  public void sendToWhatsApp(String phone, String base64Png, String caption, String preferredPkg) {
                      runOnUiThread(() -> {
                          try {
                              byte[] decoded = Base64.decode(base64Png, Base64.DEFAULT);
                              File cachePath = new File(getCacheDir(), "receipts");
                              if (!cachePath.exists()) cachePath.mkdirs();
                              File file = new File(cachePath, "receipt_" + System.currentTimeMillis() + ".png");
                              try (FileOutputStream fos = new FileOutputStream(file)) {
                                  fos.write(decoded);
                              }
                              Uri contentUri = FileProvider.getUriForFile(MainActivity.this, getPackageName() + ".fileprovider", file);
                              String cleanPhone = phone.replaceAll("[^\\d]", "");
                              Intent intent = new Intent(Intent.ACTION_SEND);
                              intent.setType("image/png");
                              intent.putExtra(Intent.EXTRA_STREAM, contentUri);
                              intent.putExtra(Intent.EXTRA_TEXT, caption);
                              if (!cleanPhone.isEmpty()) intent.putExtra("jid", cleanPhone + "@s.whatsapp.net");
                              intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);

                              String targetPkg = null;
                              if ("com.whatsapp".equals(preferredPkg) && isPackageInstalled("com.whatsapp")) targetPkg = "com.whatsapp";
                              else if ("com.whatsapp.w4b".equals(preferredPkg) && isPackageInstalled("com.whatsapp.w4b")) targetPkg = "com.whatsapp.w4b";
                              else if (isPackageInstalled("com.whatsapp")) targetPkg = "com.whatsapp";
                              else if (isPackageInstalled("com.whatsapp.w4b")) targetPkg = "com.whatsapp.w4b";

                              if (targetPkg != null) {
                                  intent.setPackage(targetPkg);
                                  startActivity(intent);
                              } else {
                                  startActivity(Intent.createChooser(intent, "إرسال السند عبر"));
                              }
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "تعذر فتح واتساب: " + e.getMessage(), Toast.LENGTH_LONG).show();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void pickContact() {
                      runOnUiThread(() -> {
                          try {
                              startActivityForResult(new Intent(Intent.ACTION_PICK, ContactsContract.CommonDataKinds.Phone.CONTENT_URI), REQ_CONTACT_PICK);
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "تعذر فتح جهات الاتصال", Toast.LENGTH_SHORT).show();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void saveFile(String filename, String mimeType, String data, boolean isBase64) {
                      runOnUiThread(() -> {
                          try {
                              pendingSaveBytes = isBase64 ? Base64.decode(data, Base64.DEFAULT) : data.getBytes(StandardCharsets.UTF_8);
                              Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                              intent.setType(mimeType);
                              intent.putExtra(Intent.EXTRA_TITLE, filename);
                              startActivityForResult(intent, REQ_SAVE_FILE);
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "تعذر الحفظ: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                          }
                      });
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daftari-Debts-APK
          path: app/build/outputs/apk/debug/app-debug.apk
