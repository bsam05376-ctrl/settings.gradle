name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix file paths automatically
        run: |
          mkdir -p /tmp/fix_src
          find . -maxdepth 15 -type f -name "MainActivity.java" -exec cp {} /tmp/fix_src/MainActivity.java \;
          find . -maxdepth 15 -type f -name "index.html" -exec cp {} /tmp/fix_src/index.html \;
          find . -maxdepth 15 -type f -name "file_paths.xml" -exec cp {} /tmp/fix_src/file_paths.xml \;
          rm -rf app/src/main/res app/src/main/java app/src/main/assets app/src/main/app
          mkdir -p app/src/main/java/com/debtsapp/ledger app/src/main/assets app/src/main/res/xml
          if [ -f /tmp/fix_src/MainActivity.java ]; then cp /tmp/fix_src/MainActivity.java app/src/main/java/com/debtsapp/ledger/MainActivity.java; fi
          if [ -f /tmp/fix_src/index.html ]; then cp /tmp/fix_src/index.html app/src/main/assets/index.html; fi
          if [ -f /tmp/fix_src/file_paths.xml ]; then
            cp /tmp/fix_src/file_paths.xml app/src/main/res/xml/file_paths.xml
          else
            printf '<?xml version="1.0" encoding="utf-8"?>\n<paths>\n    <cache-path name="receipts" path="receipts/" />\n</paths>\n' > app/src/main/res/xml/file_paths.xml
          fi
          ls -la app/src/main/java/com/debtsapp/ledger/ app/src/main/assets/ app/src/main/res/xml/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daftari-Debts-APK
          path: app/build/outputs/apk/debug/app-debug.apk
